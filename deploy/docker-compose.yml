# Prepared production stack. Not started by the CT 102 sandbox workflow.
name: atheena
x-app: &app
  image: atheena-api:local
  env_file: ../.env.production
  environment:
    APP_ENV: production
    DEV_AUTH_EMAIL: ''
    DATABASE_URL: postgresql+asyncpg://atheena:${POSTGRES_PASSWORD:?required}@postgres:5432/atheena
    REDIS_URL: redis://redis:6379/0
    CF_ACCESS_TEAM_DOMAIN: ${CF_ACCESS_TEAM_DOMAIN:?required}
    CF_ACCESS_AUD: ${CF_ACCESS_AUD:?required}
    CF_ACCESS_ADMIN_AUD: ${CF_ACCESS_ADMIN_AUD:?required}
    PORTAL_CONSOLE_HOST: console.atheena.online
    PUBLIC_API_BASE_URL: https://atheena.online/v1
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}
  restart: unless-stopped
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
services:
  api:
    <<: *app
    build:
      context: ..
      dockerfile: backend/Dockerfile
  worker:
    <<: *app
    command: [python, -m, app.worker]
  caddy:
    image: caddy:2-alpine
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../frontend/dist:/srv:ro
    depends_on: [api]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: atheena
      POSTGRES_DB: atheena
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U atheena -d atheena]
      interval: 5s
      retries: 15
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, 'yes']
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      retries: 15
    restart: unless-stopped
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?required}
    depends_on: [caddy]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
volumes:
  postgres-data:
  redis-data:
