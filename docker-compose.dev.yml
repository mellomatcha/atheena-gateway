# Development services for machines with Docker (CI runners use their own service containers).
# VM 999 runs Postgres and Redis natively; see CLAUDE.md.
# Usage: make dev USE_DOCKER=1, then point .env at 127.0.0.1:
#   DATABASE_URL=postgresql+asyncpg://agent@127.0.0.1:5432/atheena
name: atheena-dev

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: agent
      POSTGRES_DB: atheena
      # Local-only dev database bound to 127.0.0.1; no secret to manage.
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    configs:
      - source: create-test-db
        target: /docker-entrypoint-initdb.d/01-create-test-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d atheena"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

configs:
  create-test-db:
    content: |
      CREATE DATABASE atheena_test OWNER agent;

volumes:
  postgres-data:
